<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}InternAutomate{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="{{ url_for('jobs.index') }}">
      <i class="bi bi-briefcase-fill me-2"></i>InternAutomate
    </a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'jobs.index' %}active{% endif %}"
             href="{{ url_for('jobs.index') }}">
            <i class="bi bi-table me-1"></i>İlanlar
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'scrape.scrape_form' %}active{% endif %}"
             href="{{ url_for('scrape.scrape_form') }}">
            <i class="bi bi-search me-1"></i>İlan Tara
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('jobs.export_csv') }}">
            <i class="bi bi-download me-1"></i>CSV İndir
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid px-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
